services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vision-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma2:2b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DEBUG=False
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - vision-events:/app/backend/data   # SQLite event/workflow store (KAN-89)
    restart: unless-stopped
    networks:
      - vision-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vision-frontend
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vision-net

  flutter-web:
    build:
      context: ./flutter_frontend
      dockerfile: Dockerfile
    container_name: vision-flutter-web
    ports:
      - "${FLUTTER_PORT:-3020}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vision-net

networks:
  vision-net:
    driver: bridge

volumes:
  vision-events:
