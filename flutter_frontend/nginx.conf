server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/wasm image/svg+xml;

    # Flutter Web SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api requests to FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Flutter's entry files are not content-hashed: always revalidate them, or
    # browsers keep running a stale build for up to a day after a redeploy.
    location ~* ^/(index\.html|main\.dart\.js|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|json|wasm)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
